<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Navalie order receiver</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f5f1; color: #111; font: 16px/1.5 Arial, sans-serif; }
      main { width: min(540px, 100%); padding: 32px; border: 1px solid #e4e1db; border-radius: 8px; background: #fff; text-align: center; }
      h1 { margin: 0 0 12px; font: 500 32px/1.2 Georgia, serif; }
      p { margin: 0; color: #6d6a66; }
    </style>
  </head>
  <body>
    <main>
      <h1>Navalie order receiver</h1>
      <p>This page is active. Verified paid orders are stored in Netlify Forms.</p>
    </main>

    <!-- Netlify detects this form during deployment. Keep the name and every field unchanged. -->
    <form name="navalie-paid-order" method="POST" action="/navalie-orders" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="navalie-paid-order">
      <p hidden><label>Do not fill this out: <input name="bot-field"></label></p>
      <input name="order_number">
      <input name="order_ref">
      <input name="status">
      <input name="customer_name">
      <input name="customer_email" type="email">
      <input name="phone">
      <textarea name="shipping_address"></textarea>
      <textarea name="shipping_json"></textarea>
      <textarea name="items"></textarea>
      <textarea name="items_readable"></textarea>
      <input name="quantity_total">
      <input name="paid_quantity">
      <input name="complimentary_quantity">
      <input name="promo_code">
      <input name="total">
      <input name="currency">
      <input name="product_id">
      <input name="plan_id">
      <input name="whop_payment_id">
      <input name="whop_checkout_id">
      <input name="created_at">
      <input name="paid_at">
      <input name="order_time_morocco">
      <textarea name="raw_json"></textarea>
    </form>
  </body>
</html>
